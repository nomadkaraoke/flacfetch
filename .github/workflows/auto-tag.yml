name: Auto Tag on Version Change

# NOTE: This workflow creates tags automatically, but due to GitHub Actions security,
# tags created by GITHUB_TOKEN do not trigger other workflows (like the release workflow).
# After this workflow completes, you need to manually re-push the tag to trigger the release:
#   git tag -d vX.X.X && git push origin :refs/tags/vX.X.X
#   git tag -a vX.X.X -m "Release vX.X.X" && git push origin vX.X.X
# Alternatively, you can use a Personal Access Token (PAT) instead of GITHUB_TOKEN.

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install toml parser
      run: pip install toml

    - name: Extract version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.get_version.outputs.tag }}" -m "Release ${{ steps.get_version.outputs.tag }}"
        git push origin "${{ steps.get_version.outputs.tag }}"

    - name: Tag already exists
      if: steps.check_tag.outputs.exists == 'true'
      run: |
        echo "Tag ${{ steps.get_version.outputs.tag }} already exists. Skipping tag creation."

    - name: Next steps
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        echo "✅ Tag ${{ steps.get_version.outputs.tag }} created successfully!"
        echo ""
        echo "⚠️  IMPORTANT: Due to GitHub Actions security, this tag won't trigger the release workflow."
        echo "To trigger the release, manually re-push the tag:"
        echo ""
        echo "  git fetch --tags"
        echo "  git tag -d ${{ steps.get_version.outputs.tag }}"
        echo "  git push origin :refs/tags/${{ steps.get_version.outputs.tag }}"
        echo "  git tag -a ${{ steps.get_version.outputs.tag }} -m 'Release ${{ steps.get_version.outputs.tag }}'"
        echo "  git push origin ${{ steps.get_version.outputs.tag }}"
        echo ""
        echo "This will trigger the release workflow and publish to PyPI."

